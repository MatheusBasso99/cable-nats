name: Cable.cr NATSBackend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: "*"

jobs:
  # Self-contained: specs run against the in-process fake NATS server.
  specs:
    strategy:
      fail-fast: false
      matrix:
        shard_file:
          - shard.yml
        crystal_version:
          - 1.19.0
          - latest
        experimental:
          - false
        include:
          - crystal_version: nightly
            experimental: true
    runs-on: ubuntu-latest
    container: crystallang/crystal:${{ matrix.crystal_version }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache Crystal
        uses: actions/cache@v4
        with:
          path: ~/.cache/crystal
          key: ${{ runner.os }}-crystal
      - name: Install shards
        run: shards install
      - name: Format
        run: crystal tool format --check
      - name: Build ameba
        run: mkdir -p bin && crystal build -o bin/ameba lib/ameba/bin/ameba.cr
      - name: Lint
        run: ./bin/ameba
      - name: Run tests
        run: crystal spec

  # Integration: the same suite against a real nats-server.
  integration:
    runs-on: ubuntu-latest
    container: crystallang/crystal:latest
    services:
      nats:
        image: nats:latest
    env:
      CABLE_BACKEND_URL: nats://nats:4222
    steps:
      - uses: actions/checkout@v4
      - name: Cache Crystal
        uses: actions/cache@v4
        with:
          path: ~/.cache/crystal
          key: ${{ runner.os }}-crystal-integration
      - name: Install shards
        run: shards install
      - name: Run tests
        run: crystal spec
